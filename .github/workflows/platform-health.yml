name: Platform health

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Comprobar plataformas
        id: health
        continue-on-error: true
        run: python scripts/platform_health.py
      - name: Abrir o actualizar incidencia
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Monitor: una o más plataformas han dejado de responder";
            const body = fs.readFileSync("platform-health-report.md", "utf8");
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Cerrar incidencia si todo vuelve a funcionar
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Monitor: una o más plataformas han dejado de responder";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed",
                state_reason: "completed"
              });
            }
      - name: Marcar workflow como fallido
        if: steps.health.outcome == 'failure'
        run: exit 1
