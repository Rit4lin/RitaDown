<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>RitaDown</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>RitaDown</h1>
        <p class="intro">Instagram · TikTok · YouTube · Facebook · X · Reddit · Vimeo · Dailymotion · Pinterest · Bluesky · Twitch</p>
      </header>

      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title" class="sr-only">Enlace multimedia</h2>
        <label for="url">URL</label>
        <textarea id="url" rows="4" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://…" required></textarea>
        <button id="analyze" type="button">Analizar</button>
      </section>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <section id="progress-panel" class="progress-panel" aria-label="Progreso de descarga" hidden>
        <div class="progress-row">
          <span id="progress-stage">Preparando</span>
          <strong id="progress-percent">0%</strong>
        </div>
        <progress id="progress" max="100" value="0">0%</progress>
        <div id="progress-meta" class="progress-meta"></div>
      </section>

      <section id="result" class="panel result" aria-labelledby="video-title" hidden>
        <img id="thumbnail" alt="Miniatura" hidden>
        <div class="metadata">
          <h2 id="video-title"></h2>
          <dl>
            <div><dt>Plataforma</dt><dd id="platform">—</dd></div>
            <div><dt>Duración</dt><dd id="duration">—</dd></div>
            <div><dt>Calidad disponible</dt><dd id="max-height">—</dd></div>
          </dl>
        </div>

        <div class="option-grid">
          <div>
            <label for="output-format">Formato</label>
            <select id="output-format">
              <option value="mp4">Vídeo MP4</option>
              <option value="audio_original">Audio original</option>
              <option value="m4a">Audio M4A</option>
              <option value="opus">Audio Opus</option>
              <option value="mp3">Audio MP3</option>
              <option value="srt">Subtítulos SRT</option>
            </select>
          </div>

          <div id="video-quality-option">
            <label for="quality">Calidad de vídeo</label>
            <select id="quality">
              <option value="original">Original / máxima disponible</option>
              <option value="2160">Máximo 2160p (4K)</option>
              <option value="1440">Máximo 1440p (2K)</option>
              <option value="1080">Máximo 1080p</option>
              <option value="720">Máximo 720p</option>
              <option value="480">Máximo 480p</option>
              <option value="360">Máximo 360p</option>
            </select>
          </div>

          <div id="codec-option">
            <label for="video-codec">Códec de vídeo</label>
            <select id="video-codec">
              <option value="original">Original (sin recodificar)</option>
              <option value="h264">H.264</option>
              <option value="h265">H.265 / HEVC</option>
            </select>
          </div>

          <div id="audio-quality-option" hidden>
            <label for="audio-quality">Calidad MP3</label>
            <select id="audio-quality">
              <option value="320">320 kbps</option>
              <option value="256">256 kbps</option>
              <option value="192" selected>192 kbps</option>
              <option value="128">128 kbps</option>
            </select>
          </div>

          <div id="subtitle-option">
            <label for="subtitle-mode">Subtítulos</label>
            <select id="subtitle-mode">
              <option value="none">Sin subtítulos</option>
              <option value="es">Español</option>
              <option value="original">Idioma original</option>
              <option value="auto">Automáticos</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button id="download" type="button">Descargar vídeo</button>
          <button id="reset" class="secondary" type="button">Borrar enlace</button>
        </div>
      </section>
    </main>
  </body>
</html>
